info:
  title: Novel Observing Strategies Testbed (NOS-T) YAML Configuration
  version: '1.0.0'
  description: Configuration for the Snow Observing Systems example
servers:
  rabbitmq:
    keycloak_authentication: False
    host: "localhost"
    port: 5672
    tls: False
    virtual_host: "/"
    message_expiration: "60000"
    heartbeat: 600
    blocked_connection_timeout: 300
execution:
  general:
    prefix: sos
    wallclock_offset_refresh_interval: 60
    ntp_host: "time.nist.gov"
  manager:
    sim_start_time: "2024-01-07T00:00:00+00:00"
    sim_stop_time: "2024-01-21T00:00:00+00:00"
    start_time:
    time_step: "0:00:01"
    # Scenario seconds per wallclock second
    time_scale_factor: 120
    time_status_step: "0:02:00"
    is_scenario_time_status_step: True
    command_lead: "0:00:05"
    required_apps:
      - manager
      - constellation
    init_retry_delay_s: 5
    init_max_retry: 5
    set_offset: True
    shut_down_when_terminated: True
  managed_applications:
    constellation:
      time_scale_factor: 120
      time_step: "0:00:01"
      is_scenario_time_step: False
      set_offset: True
      time_status_step: "0:00:10"
      is_scenario_time_status_step: False
      shut_down_when_terminated: True
      manager_app_name: "manager"
      configuration_parameters:
        # Satellites to load from the Celestrak active satellite catalogue. The
        # names must match the catalogue exactly, including capitalisation.
        SATELLITE_NAMES:
          - "CAPELLA-14 (ACADIA-4)"
          - "GCOM-W1 (SHIZUKU)"
